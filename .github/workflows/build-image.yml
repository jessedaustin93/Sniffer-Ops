name: Build SnifferOps OS image

# Reproducible appliance image: on a version tag, build the Bookworm Lite +
# SnifferOps image with pi-gen and publish it as a release asset with a
# SHA-256 sidecar. This is what makes the build reproducible instead of
# "whatever was on a laptop".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # create release + upload assets

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SnifferOps
        uses: actions/checkout@v4
        with:
          path: sniffer-ops

      - name: Free up runner disk space
        run: |
          # Hosted runners start with ~14 GB free; a full arm64 pi-gen build
          # (multiple per-stage rootfs copies) needs far more. Reclaim ~25-30 GB
          # by dropping toolchains this job doesn't use.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Checkout pi-gen (Bookworm)
        uses: actions/checkout@v4
        with:
          repository: RPi-Distro/pi-gen
          ref: bookworm
          path: pi-gen

      - name: Install qemu-user-static (pi-gen needs qemu-*-static + binfmt)
        run: |
          set -euo pipefail
          sudo apt-get update
          # Provides /usr/bin/qemu-arm-static (pi-gen bind-mounts it for the arm
          # chroot) and registers binfmt handlers for arm/aarch64 emulation.
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-arm || true
          sudo update-binfmts --enable qemu-aarch64 || true
          test -x /usr/bin/qemu-arm-static && echo "qemu-arm-static present"

      - name: Assemble pi-gen config + custom stage
        run: |
          set -euo pipefail
          VERSION="$(cat sniffer-ops/linux/VERSION)"
          echo "IMG_VERSION=${VERSION}" >> "$GITHUB_ENV"

          # Drop our config in and stamp the image name with the version.
          cp sniffer-ops/image/config pi-gen/config
          echo "IMG_NAME=snifferops-os-${VERSION}" >> pi-gen/config

          # Custom stage into pi-gen's tree.
          cp -r sniffer-ops/image/stage-snifferops pi-gen/stage-snifferops
          # Skip pi-gen's own image-export stages beyond ours (Lite only).
          touch pi-gen/stage2/SKIP_IMAGES pi-gen/stage2/SKIP_NOOBS || true

          # The custom stage needs the repo path at build time.
          echo "SNIFFEROPS_REPO=${GITHUB_WORKSPACE}/sniffer-ops" >> "$GITHUB_ENV"

      - name: Build image (pi-gen, docker)
        working-directory: pi-gen
        env:
          SNIFFEROPS_REPO: ${{ env.SNIFFEROPS_REPO }}
          # Login/admin user for SSH management. Must differ from the `snifferops`
          # service user (which is nologin). Non-sensitive; override via repo var.
          FIRST_USER_NAME: ${{ vars.APPLIANCE_USER || 'pi' }}
          # Key-only SSH. The value is a PUBLIC key (not sensitive) supplied as a
          # repo secret so no key material or personal data lands in the tree.
          PUBKEY_SSH_FIRST_USER: ${{ secrets.APPLIANCE_SSH_PUBKEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBKEY_SSH_FIRST_USER}" ]; then
            echo "::error::APPLIANCE_SSH_PUBKEY secret is not set. The image uses"
            echo "::error::key-only SSH, so add your PUBLIC key as that repo secret"
            echo "::error::(Settings -> Secrets and variables -> Actions) and re-run."
            exit 1
          fi
          # Pass our env into the containerized build.
          export PIGEN_DOCKER_OPTS="-e SNIFFEROPS_REPO -e FIRST_USER_NAME -e PUBKEY_SSH_FIRST_USER -v ${SNIFFEROPS_REPO}:${SNIFFEROPS_REPO}:ro"
          sudo -E ./build-docker.sh

      - name: Compress + checksum
        id: artifact
        working-directory: pi-gen
        run: |
          set -euo pipefail
          IMG="$(find deploy -name '*.img' | head -n1)"
          test -n "$IMG"
          xz -T0 -9 "$IMG"
          OUT="${IMG}.xz"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          echo "path=pi-gen/${OUT}" >> "$GITHUB_OUTPUT"
          echo "sha=pi-gen/${OUT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.sha }}
          body: |
            SnifferOps OS ${{ env.IMG_VERSION }} — Bookworm Lite arm64 appliance image.
            Verify: `sha256sum -c *.sha256`
